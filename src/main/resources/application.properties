spring.application.name=bia-app

server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/bia?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:1234}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=true
# NOTA: open-in-view=true permite acceso lazy en las vistas Thymeleaf.
# Para produccion, considerar desactivarlo y usar DTOs o JOIN FETCH.