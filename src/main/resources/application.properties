spring.application.name=bia-app

server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/bia?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:1234}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=true
# NOTA: open-in-view=true permite acceso lazy en las vistas Thymeleaf.
# Para produccion, considerar desactivarlo y usar DTOs o JOIN FETCH.
# ===== Seguridad =====
# Primer administrador (solo se crea si la tabla de usuarios está vacía).
# Si no defines BIA_ADMIN_PASSWORD se genera una contraseña temporal y se muestra en el log de arranque.
bia.admin.username=${BIA_ADMIN_USERNAME:admin}
bia.admin.password=${BIA_ADMIN_PASSWORD:}

# Cookie de sesión endurecida. En producción (HTTPS) define SESSION_COOKIE_SECURE=true.
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.tracking-modes=cookie
server.error.include-stacktrace=never
