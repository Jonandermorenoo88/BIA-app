<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head>
    <title>BIA App - Empresas</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>

<body>
    <div class="container">
        <header class="header">
            <h1>Gestión de Empresas</h1>
            <p>Administra tus empresas y sus procesos de negocio</p>
        </header>

        <!-- FLASH MESSAGES -->
        <div th:if="${flashSuccess}" class="flash-message flash-success">
            ✅ <span th:text="${flashSuccess}"></span>
        </div>
        <div th:if="${flashError}" class="flash-message flash-error">
            ❌ <span th:text="${flashError}"></span>
        </div>

        <section class="glass-card form-section">
            <h2 class="section-title">Registrar Nueva Empresa</h2>
            <form action="/empresas/guardar" method="post">
                <div class="form-grid">
                    <div class="input-group">
                        <label for="nombre">Nombre de la empresa</label>
                        <input type="text" id="nombre" name="nombre" placeholder="ej. Acxiom Corp" required />
                    </div>
                    <div class="input-group">
                        <label for="sector">Sector industrial</label>
                        <input type="text" id="sector" name="sector" placeholder="ej. Tecnología" required />
                    </div>
                    <div class="input-group">
                        <label for="tamano">Tamaño (Empleados)</label>
                        <input type="text" id="tamano" name="tamano" placeholder="ej. 5000+" required />
                    </div>
                </div>
                <button type="submit" class="btn-submit">Añadir Empresa</button>
            </form>
        </section>

        <section class="glass-card list-section">
            <h2 class="section-title">Empresas Registradas</h2>

            <div class="company-grid" th:if="${empresas != null and !empresas.isEmpty()}">
                <article class="company-card" th:each="empresa : ${empresas}">
                    <div style="display: flex; justify-content: space-between; align-items: flex-start;">
                        <h3 class="company-name" th:text="${empresa.nombre}">Nombre Empresa</h3>
                        <div class="action-buttons">
                            <button class="btn-icon" type="button"
                                    th:onclick="'toggleEdit(' + ${empresa.id} + ')'">✏️</button>
                            <form th:action="@{/empresas/{id}/eliminar(id=${empresa.id})}" method="post"
                                  style="margin: 0;" onsubmit="return confirm('¿Eliminar esta empresa y TODOS sus datos asociados (BIAs, procesos, activos, personas)? Esta acción no se puede deshacer.')">
                                <button type="submit" class="btn-icon danger">🗑️</button>
                            </form>
                        </div>
                    </div>
                    <div class="company-details">
                        <div class="detail-item">
                            <span class="detail-icon">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2">
                                    <path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6" />
                                </svg>
                            </span>
                            Sector: <strong style="color:white; margin-left: 4px;"
                                th:text="${empresa.sector}">Sector</strong>
                        </div>
                        <div class="detail-item">
                            <span class="detail-icon">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2">
                                    <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                                    <circle cx="9" cy="7" r="4"></circle>
                                    <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                                    <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                                </svg>
                            </span>
                            Tamaño: <strong style="color:white; margin-left: 4px;"
                                th:text="${empresa.tamano}">Tamaño</strong>
                        </div>
                    </div>

                    <!-- EDIT FORM (hidden by default) -->
                    <div th:id="'edit-' + ${empresa.id}" style="display: none; margin-top: 1rem; border-top: 1px solid var(--border-color); padding-top: 1rem;">
                        <form th:action="@{/empresas/{id}/editar(id=${empresa.id})}" method="post">
                            <input type="text" name="nombre" th:value="${empresa.nombre}" required class="input-modern" placeholder="Nombre" />
                            <input type="text" name="sector" th:value="${empresa.sector}" required class="input-modern" placeholder="Sector" />
                            <input type="text" name="tamano" th:value="${empresa.tamano}" required class="input-modern" placeholder="Tamaño" />
                            <div style="display: flex; gap: 0.5rem; margin-top: 0.5rem;">
                                <button type="submit" class="btn-edit" style="flex: 1;">Guardar</button>
                                <button type="button" class="btn-icon" th:onclick="'toggleEdit(' + ${empresa.id} + ')'">Cancelar</button>
                            </div>
                        </form>
                    </div>

                    <a th:href="@{/empresas/{id}(id=${empresa.id})}" class="btn-submit"
                        style="display: block; text-align: center; margin-top: 1.5rem; text-decoration: none; font-size: 0.9rem; padding: 0.6rem 1rem;">Ver
                        Dashboard BIA</a>
                </article>
            </div>

            <div class="empty-state" th:if="${empresas == null or empresas.isEmpty()}">
                <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="var(--text-secondary)"
                    stroke-width="1" style="margin-bottom: 1rem;">
                    <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                    <circle cx="8.5" cy="8.5" r="1.5"></circle>
                    <polyline points="21 15 16 10 5 21"></polyline>
                </svg>
                <p>No hay empresas registradas todavía.</p>
                <p style="font-size: 0.875rem; margin-top: 0.5rem; opacity: 0.7;">Las empresas que añadas aparecerán
                    aquí.</p>
            </div>
        </section>
    </div>

    <script>
        function toggleEdit(id) {
            const el = document.getElementById('edit-' + id);
            el.style.display = el.style.display === 'none' ? 'block' : 'none';
        }
    </script>
</body>

</html>
