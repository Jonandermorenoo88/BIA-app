<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head>
    <title>BIA App - Empresas</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>

<body>
    <div class="container">
        <header class="header">
            <h1>Gestion de Empresas</h1>
            <p>Administra tus empresas y sus procesos de negocio</p>
        </header>

        <section class="glass-card form-section">
            <h2 class="section-title">Registrar Nueva Empresa</h2>
            <form action="/empresas/guardar" method="post">
                <div class="form-grid">
                    <div class="input-group">
                        <label for="nombre">Nombre de la empresa</label>
                        <input type="text" id="nombre" name="nombre" placeholder="ej. Acxiom Corp" required />
                    </div>
                    <div class="input-group">
                        <label for="sector">Sector industrial</label>
                        <input type="text" id="sector" name="sector" placeholder="ej. Tecnología" required />
                    </div>
                    <div class="input-group">
                        <label for="tamano">Tamaño (Empleados)</label>
                        <input type="text" id="tamano" name="tamano" placeholder="ej. 5000+" required />
                    </div>
                </div>
                <button type="submit" class="btn-submit">Añadir Empresa</button>
            </form>
        </section>

        <section class="glass-card list-section">
            <h2 class="section-title">Empresas Registradas</h2>

            <div class="company-grid" th:if="${empresas != null and !empresas.isEmpty()}">
                <article class="company-card" th:each="empresa : ${empresas}">
                    <h3 class="company-name" th:text="${empresa.nombre}">Nombre Empresa</h3>
                    <div class="company-details">
                        <div class="detail-item">
                            <span class="detail-icon">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2">
                                    <path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6" />
                                </svg>
                            </span>
                            Sector: <strong style="color:white; margin-left: 4px;"
                                th:text="${empresa.sector}">Sector</strong>
                        </div>
                        <div class="detail-item">
                            <span class="detail-icon">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2">
                                    <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                                    <circle cx="9" cy="7" r="4"></circle>
                                    <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                                    <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                                </svg>
                            </span>
                            Tamaño: <strong style="color:white; margin-left: 4px;"
                                th:text="${empresa.tamano}">Tamaño</strong>
                        </div>
                    </div>
                    <a th:href="@{/empresas/{id}(id=${empresa.id})}" class="btn-submit"
                        style="display: block; text-align: center; margin-top: 1.5rem; text-decoration: none; font-size: 0.9rem; padding: 0.6rem 1rem;">Ver
                        Dashboard BIA</a>
                </article>
            </div>

            <div class="empty-state" th:if="${empresas == null or empresas.isEmpty()}">
                <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="var(--text-secondary)"
                    stroke-width="1" style="margin-bottom: 1rem;">
                    <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                    <circle cx="8.5" cy="8.5" r="1.5"></circle>
                    <polyline points="21 15 16 10 5 21"></polyline>
                </svg>
                <p>No hay empresas registradas todavía.</p>
                <p style="font-size: 0.875rem; margin-top: 0.5rem; opacity: 0.7;">Las empresas que añadas aparecerán
                    aquí.</p>
            </div>
        </section>
    </div>
</body>

</html>
