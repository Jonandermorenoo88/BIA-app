<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <title>Cambiar contraseña - BIA App</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
    <div class="container">
        <div th:replace="~{fragments/nav :: nav}"></div>

        <header class="header">
            <h1>Cambiar contraseña</h1>
            <p th:if="${usuarioActual != null and usuarioActual.debeCambiarPassword}">
                Tu contraseña es temporal. Debes cambiarla para continuar.
            </p>
        </header>

        <div th:if="${flashError}" class="flash-message flash-error">
            ❌ <span th:text="${flashError}"></span>
        </div>

        <section class="glass-card auth-card">
            <form th:action="@{/cuenta/password}" method="post">
                <div class="input-group">
                    <label for="actual">Contraseña actual</label>
                    <input type="password" id="actual" name="actual" required autocomplete="current-password" />
                </div>
                <div class="input-group">
                    <label for="nueva">Nueva contraseña</label>
                    <input type="password" id="nueva" name="nueva" required th:attr="minlength=${longitudMinima}"
                           maxlength="72" autocomplete="new-password" />
                </div>
                <div class="input-group">
                    <label for="confirmacion">Repite la nueva contraseña</label>
                    <input type="password" id="confirmacion" name="confirmacion" required th:attr="minlength=${longitudMinima}"
                           maxlength="72" autocomplete="new-password" />
                </div>
                <p style="font-size: 0.8rem; color: var(--text-secondary); margin-bottom: 1rem;">
                    Mínimo <span th:text="${longitudMinima}">12</span> caracteres, combinando letras y números.
                </p>
                <button type="submit" class="btn-submit">Guardar nueva contraseña</button>
            </form>
        </section>
    </div>
</body>
</html>
