<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <title>Error - BIA App</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1 th:text="${errorTitulo} ?: 'Error'">Error</h1>
            <p th:text="${errorMensaje} ?: 'Ha ocurrido un error inesperado.'">Mensaje de error</p>
        </header>

        <section class="glass-card" style="text-align: center; padding: 3rem 2rem;">
            <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="var(--primary-color)" stroke-width="1.5" style="margin-bottom: 1.5rem;">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="12" y1="8" x2="12" y2="12"></line>
                <line x1="12" y1="16" x2="12.01" y2="16"></line>
            </svg>
            <p style="color: var(--text-secondary); margin-bottom: 2rem;">El recurso solicitado no se ha podido procesar.</p>
            <a href="/empresas" class="btn-submit" style="display: inline-block; width: auto; padding: 0.75rem 2rem; text-decoration: none;">← Volver al inicio</a>
        </section>
    </div>
</body>
</html>
